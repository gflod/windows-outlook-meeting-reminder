[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-reminder"
version = "0.1.0"
description = "Flying-airplane meeting reminder for Windows, reading classic Outlook"
requires-python = ">=3.11"
# Installed via conda (environment.yml); listed for reference.
dependencies = ["PySide6>=6.6", "pywin32>=306"]

[project.gui-scripts]
meeting-reminder = "meeting_reminder.__main__:main"

[tool.setuptools]
packages = ["meeting_reminder"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# House style mandates `str, Enum` for fixed-option parameters.
ignore = ["UP042"]
